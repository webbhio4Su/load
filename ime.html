<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iMell</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.logo-text {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    opacity: 0;
    visibility: hidden;
    user-select: none;
}

.logo-text.show {
    opacity: 1;
    visibility: visible;
}

.logo {
    width: 100px;
    height: 100px;
    flex-shrink: 0;

    /* Quan trọng: logo web xoay quanh tâm */
    transform-origin: center center;
}

.sample {
    font-family: "Fredoka", sans-serif;
    font-size: 100px;
    font-weight: 600;
    color: white;
    line-height: 1;
}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap"
    rel="stylesheet"
>

</head>

<body>

<div class="logo-text" id="logoText">

    <!-- LOGO WEB -->
    <svg
        class="logo"
        id="mainLogo"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
    >
        <rect
            x="0"
            y="0"
            width="100"
            height="100"
            rx="22"
            fill="white"
        />

        <rect
            x="25"
            y="25"
            width="50"
            height="50"
            rx="8"
            fill="black"
            transform="rotate(45 50 50)"
        />

        <rect
            x="38"
            y="38"
            width="24"
            height="24"
            rx="5"
            fill="white"
        />
    </svg>

    <div class="sample">iMell</div>

</div>


<script>

const logoText = document.getElementById("logoText");
const mainLogo = document.getElementById("mainLogo");

let rotation = 0;


/* ================================
   FAVICON
================================ */

const canvas = document.createElement("canvas");

canvas.width = 64;
canvas.height = 64;

const ctx = canvas.getContext("2d");

const favicon = document.createElement("link");

favicon.rel = "icon";
favicon.type = "image/png";

document.head.appendChild(favicon);


/* SVG favicon */

const faviconSVG = `
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="100"
    height="100"
    viewBox="0 0 100 100"
>

    <rect
        x="0"
        y="0"
        width="100"
        height="100"
        rx="22"
        fill="white"
    />

    <rect
        x="25"
        y="25"
        width="50"
        height="50"
        rx="8"
        fill="black"
        transform="rotate(45 50 50)"
    />

    <rect
        x="38"
        y="38"
        width="24"
        height="24"
        rx="5"
        fill="white"
    />

</svg>
`;

const svgBlob = new Blob(
    [faviconSVG],
    { type: "image/svg+xml" }
);

const svgURL = URL.createObjectURL(svgBlob);

const faviconImage = new Image();

faviconImage.src = svgURL;


/* ================================
   CẬP NHẬT FAVICON
================================ */

function updateFavicon() {

    ctx.clearRect(0, 0, 64, 64);

    ctx.save();

    ctx.translate(32, 32);

    ctx.rotate(
        rotation * Math.PI / 180
    );

    ctx.drawImage(
        faviconImage,
        -32,
        -32,
        64,
        64
    );

    ctx.restore();

    favicon.href = canvas.toDataURL("image/png");
}


/* ================================
   XOAY LOGO WEB + TAB
================================ */

async function animateLogo() {

    while (true) {

        for (let i = 0; i < 6; i++) {

            rotation += 15;

            /*
             * LOGO TRÊN WEB
             */
            mainLogo.style.transform =
                `rotate(${rotation}deg)`;


            /*
             * LOGO TRÊN TAB
             */
            updateFavicon();


            /*
             * 33ms
             */
            await new Promise(resolve => {
                setTimeout(resolve, 33);
            });
        }


        /*
         * Nghỉ
         */
        await new Promise(resolve => {
            setTimeout(resolve, 1357.90001);
        });
    }
}


/* ================================
   HIỆN SAU 0.3 GIÂY
================================ */

setTimeout(() => {

    logoText.classList.add("show");

    /*
     * Đợi favicon load rồi bắt đầu
     */
    if (faviconImage.complete) {
        updateFavicon();
        animateLogo();
    } else {
        faviconImage.onload = () => {
            updateFavicon();
            animateLogo();
        };
    }

}, 300);

</script>

</body>
</html>
