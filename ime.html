<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>iMell</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Không cho font nhảy từ font mặc định sang Fredoka */
.sample {
  font-family: "Fredoka", sans-serif;
  font-size: 100px;
  font-weight: 600;
  color: #fff;
  line-height: 1;

  user-select: none;
  -webkit-user-select: none;

  visibility: hidden;
}

.font-loaded .sample {
  visibility: visible;
}

.logo-text {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;

  user-select: none;
  -webkit-user-select: none;
}

.logo {
  width: 100px;
  height: 100px;
  flex-shrink: 0;

  transform: rotate(0deg);
  transform-origin: center center;

  will-change: transform;
}
</style>
</head>

<body>

<div class="logo-text">

  <!-- iMell LOGO -->
  <svg
    class="logo"
    viewBox="0 0 113.34675 113.34675"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="iMell logo"
  >
    <g transform="translate(-182.67759,-124.34157)">

      <!-- Khung trắng -->
      <path
        d="M182.67759,149.34157
           c0,-13.80712 11.19288,-25 25,-25
           l63.34675,0
           c13.80712,0 25,11.19288 25,25
           l0,63.34675
           c0,13.80712 -11.19288,25 -25,25
           h-63.34675
           c-13.80712,0 -25,-11.19288 -25,-25z"
        fill="#ffffff"
      />

      <!-- Hình đen bên trong -->
      <path
        d="M202.52775,195.53801
           c-7.66241,-7.66241 -7.66241,-20.08564 0,-27.74805
           l23.96413,-23.96413
           c7.66241,-7.66241 20.08564,-7.66241 27.74805,0
           l23.96413,23.96413
           c7.66241,7.66241 7.66241,20.08564 0,27.74805
           l-23.96413,23.96413
           c-7.66241,7.66241 -20.08564,7.66241 -27.74805,0z"
        fill="#000000"
      />

      <!-- Hình trắng bên trong -->
      <path
        d="M221.22588,169.06423
           c0,-3.6121 2.92818,-6.54028 6.54028,-6.54028
           h25.19951
           c3.6121,0 6.54028,2.92818 6.54028,6.54028
           l0,25.19951
           c0,3.6121 -2.92818,6.54028 -6.54028,6.54028
           h-25.19951
           c-3.6121,0 -6.54028,-2.92818 -6.54028,-6.54028z"
        fill="#ffffff"
      />

    </g>
  </svg>

  <div class="sample">iMell</div>

</div>

<script>
/* =========================================
   CHỜ GOOGLE FONTS TẢI XONG
   ========================================= */

document.fonts.ready.then(() => {
  document.documentElement.classList.add("font-loaded");
});


/* =========================================
   iMell LOGO ANIMATION
   ========================================= */

const logo = document.querySelector(".logo");

/*
   Mỗi bước:
   15 độ
   ↓
   0.033 giây

   6 bước:
   0 → 15 → 30 → 45 → 60 → 75 → 90

   Sau 90 độ:
   nghỉ 1.35790001 giây

   Sau đó lặp lại.
*/

const STEP_TIME = 33;
const PAUSE_TIME = 1357.90001;
const STEP_ANGLE = 15;
const STEP_COUNT = 6;

const ROTATION_TIME =
  STEP_TIME * STEP_COUNT;

const CYCLE_TIME =
  ROTATION_TIME + PAUSE_TIME;

const startTime = performance.now();


function updateLogo() {

  const now = performance.now();

  /*
    Dùng thời gian thực thay vì
    setTimeout(33) làm đồng hồ chính.
  */

  const elapsed =
    (now - startTime) % CYCLE_TIME;

  let rotation;


  /* Đang xoay */
  if (elapsed < ROTATION_TIME) {

    const step =
      Math.floor(elapsed / STEP_TIME);

    rotation =
      step * STEP_ANGLE;

  }

  /* Đã xoay tới 90° và đang nghỉ */
  else {

    rotation =
      STEP_COUNT * STEP_ANGLE;

  }


  logo.style.transform =
    `rotate(${rotation}deg)`;


  requestAnimationFrame(updateLogo);
}


updateLogo();
</script>

</body>
</html>
