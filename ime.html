<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iMell</title>

<!-- Favicon Dark -->
<link
    id="faviconDark"
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='white'/%3E%3Crect x='25' y='25' width='50' height='50' rx='8' fill='black' transform='rotate(45 50 50)'/%3E%3Crect x='38' y='38' width='24' height='24' rx='5' fill='white'/%3E%3C/svg%3E"
>

<!-- Favicon Light -->
<link
    id="faviconLight"
    rel="icon"
    type="image/svg+xml"
    media="(prefers-color-scheme: light)"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='black'/%3E%3Crect x='25' y='25' width='50' height='50' rx='8' fill='white' transform='rotate(45 50 50)'/%3E%3Crect x='38' y='38' width='24' height='24' rx='5' fill='black'/%3E%3C/svg%3E"
>

<!-- Fredoka -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap"
    rel="stylesheet"
>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    transition: background 0.2s ease;
}

.logo-text {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 22px;

    user-select: none;

    opacity: 0;
    visibility: hidden;
}

.logo-text.show {
    opacity: 1;
    visibility: visible;
}

.logo {
    width: 100px;
    height: 100px;

    flex-shrink: 0;

    transform-origin: 50% 50%;
}

.sample {
    font-family: "Fredoka", sans-serif;

    font-size: 100px;
    font-weight: 600;

    color: white;

    line-height: 1;

    transition: color 0.2s ease;
}

/* =========================
   LIGHT MODE
   ========================= */

@media (prefers-color-scheme: light) {

    body {
        background: #fff;
    }

    .sample {
        color: #000;
    }

    .logo {
        filter: invert(1);
    }
}
</style>
</head>

<body>

<div class="logo-text" id="logoText">

    <svg
        class="logo"
        id="mainLogo"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
    >

        <!-- Nền -->
        <rect
            x="0"
            y="0"
            width="100"
            height="100"
            rx="22"
            fill="white"
        />

        <!-- Hình vuông xoay -->
        <rect
            x="25"
            y="25"
            width="50"
            height="50"
            rx="8"
            fill="black"
            transform="rotate(45 50 50)"
        />

        <!-- Lỗ giữa -->
        <rect
            x="38"
            y="38"
            width="24"
            height="24"
            rx="5"
            fill="white"
        />

    </svg>

    <div class="sample">
        iMell
    </div>

</div>

<script>

const logoText = document.getElementById("logoText");
const mainLogo = document.getElementById("mainLogo");

let rotation = 0;

/*
    Xuất hiện sau 0.3 giây
*/
setTimeout(() => {

    logoText.classList.add("show");

    animateLogo();

}, 300);


/*
    Animation logo WEB
    Favicon không bị ảnh hưởng
*/
async function animateLogo() {

    while (true) {

        for (let i = 0; i < 6; i++) {

            rotation += 15;

            mainLogo.style.transform =
                `rotate(${rotation}deg)`;

            await new Promise(resolve => {

                setTimeout(resolve, 33);

            });

        }

        /*
            Nghỉ sau khi xoay đủ 90°
        */
        await new Promise(resolve => {

            setTimeout(resolve, 1357.90001);

        });

    }

}

</script>

</body>
</html>
