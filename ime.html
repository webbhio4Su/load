<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>iMell</title>

<!-- =========================
     GOOGLE FONT
========================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<!-- =========================
     FAVICON / LOGO TAB
========================= -->
<script>
(function () {
  const faviconSVG = `
  <svg xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 113.34675 113.34675">

    <rect
      x="0"
      y="0"
      width="113.34675"
      height="113.34675"
      rx="25"
      fill="white"/>

    <path
      d="M19.85016,71.19644
         c-7.66241,-7.66241 -7.66241,-20.08564 0,-27.74805
         l23.96413,-23.96413
         c7.66241,-7.66241 20.08564,-7.66241 27.74805,0
         l23.96413,23.96413
         c7.66241,7.66241 7.66241,20.08564 0,27.74805
         l-23.96413,23.96413
         c-7.66241,7.66241 -20.08564,7.66241 -27.74805,0z"
      fill="black"/>

    <rect
      x="38.54829"
      y="38.18109"
      width="38.28007"
      height="38.28007"
      rx="6.54028"
      fill="white"/>
  </svg>`;

  const favicon = document.createElement("link");
  favicon.rel = "icon";
  favicon.type = "image/svg+xml";
  favicon.id = "iMellFavicon";

  function updateFavicon(darkMode) {
    const svg = faviconSVG
      .replace(/white/g, darkMode ? "black" : "white")
      .replace(/black/g, darkMode ? "white" : "black");

    favicon.href =
      "data:image/svg+xml;charset=utf-8," +
      encodeURIComponent(svg);
  }

  document.head.appendChild(favicon);

  const media = window.matchMedia("(prefers-color-scheme: dark)");

  function updateTheme() {
    updateFavicon(media.matches);
  }

  updateTheme();

  if (media.addEventListener) {
    media.addEventListener("change", updateTheme);
  } else {
    media.addListener(updateTheme);
  }
})();
</script>

<!-- =========================
     STYLE
========================= -->
<style>

:root {
  --bg: #ffffff;
  --fg: #000000;
  --logo-bg: #000000;
  --logo-inner: #ffffff;
}

/* DARK MODE */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --logo-bg: #ffffff;
    --logo-inner: #000000;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--fg);

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  transition:
    background-color 0.15s linear,
    color 0.15s linear;
}

/* =========================
   LOGO + TEXT
========================= */

.logo-text {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 22px;

  user-select: none;
  -webkit-user-select: none;

  -webkit-touch-callout: none;
}

/* =========================
   SVG LOGO
========================= */

.logo {
  width: 100px;
  height: 100px;

  flex-shrink: 0;

  display: block;

  transform-origin: center center;

  will-change: transform;
}

/* =========================
   LOGO COLORS
========================= */

.logo .outer {
  fill: var(--logo-bg);
}

.logo .middle {
  fill: var(--logo-inner);
}

.logo .inner {
  fill: var(--logo-bg);
}

/* =========================
   iMell TEXT
========================= */

.sample {
  font-family: "Fredoka", sans-serif;

  font-size: 100px;
  font-weight: 600;

  color: var(--fg);

  line-height: 1;

  white-space: nowrap;

  user-select: none;
  -webkit-user-select: none;

  /* Không hiện fallback font trước */
  visibility: hidden;
}

/* Font đã sẵn sàng */
.font-ready .sample {
  visibility: visible;
}

</style>
</head>

<body>

<div class="logo-text">

  <!-- =========================
       iMell SVG LOGO
  ========================= -->

  <svg
    class="logo"
    version="1.1"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0,0,113.34675,113.34675"
    aria-label="iMell logo"
  >

    <g transform="translate(-182.67759,-124.34157)">

      <g
        stroke="none"
        stroke-miterlimit="10"
      >

        <!-- Outer -->
        <path
          class="outer"
          d="
          M182.67759,149.34157
          c0,-13.80712 11.19288,-25 25,-25
          l63.34675,0
          c13.80712,0 25,11.19288 25,25
          l0,63.34675
          c0,13.80712 -11.19288,25 -25,25
          h-63.34675
          c-13.80712,0 -25,-11.19288 -25,-25z
          "
        />

        <!-- Middle -->
        <path
          class="middle"
          d="
          M202.52775,195.53801
          c-7.66241,-7.66241 -7.66241,-20.08564 0,-27.74805
          l23.96413,-23.96413
          c7.66241,-7.66241 20.08564,-7.66241 27.74805,0
          l23.96413,23.96413
          c7.66241,7.66241 7.66241,20.08564 0,27.74805
          l-23.96413,23.96413
          c-7.66241,7.66241 -20.08564,7.66241 -27.74805,0z
          "
        />

        <!-- Inner -->
        <path
          class="inner"
          d="
          M221.22588,169.06423
          c0,-3.6121 2.92818,-6.54028 6.54028,-6.54028
          h25.19951
          c3.6121,0 6.54028,2.92818 6.54028,6.54028
          l0,25.19951
          c0,3.6121 -2.92818,6.54028 -6.54028,6.54028
          h-25.19951
          c-3.6121,0 -6.54028,-2.92818 -6.54028,-6.54028z
          "
        />

      </g>
    </g>

  </svg>

  <!-- =========================
       TEXT
  ========================= -->

  <div class="sample">iMell</div>

</div>


<script>

/* =========================================================
   CHỜ GOOGLE FONTS
   → tránh hiện font mặc định rồi nhảy sang Fredoka
========================================================= */

if (document.fonts && document.fonts.ready) {

  document.fonts.ready.then(() => {
    document.documentElement.classList.add("font-ready");
  });

} else {

  document.documentElement.classList.add("font-ready");

}


/* =========================================================
   iMell LOGO ANIMATION

   15° → 15° → 15° → 15° → 15° → 15°
   mỗi bước ≈ 0.033 giây

   Sau 6 bước:
   nghỉ 1.35790001 giây

   rồi lặp lại.
========================================================= */

const logo = document.querySelector(".logo");

let rotation = 0;

const STEP = 15;
const STEP_TIME = 33;
const STEPS = 6;
const PAUSE = 1357.90001;


/* =========================================================
   DÙNG CLOCK THỰC

   Không phụ thuộc hoàn toàn vào setTimeout.

   Nếu trình duyệt giảm FPS khi tab ở nền,
   rotation vẫn dựa trên thời gian thực.
========================================================= */

let nextStep = performance.now();
let step = 0;
let pausedUntil = 0;

function animateLogo(now) {

  /* Đang trong khoảng nghỉ */
  if (now < pausedUntil) {
    requestAnimationFrame(animateLogo);
    return;
  }

  /* Đã đến thời điểm xoay */
  if (now >= nextStep) {

    rotation += STEP;

    logo.style.transform =
      `rotate(${rotation}deg)`;

    step++;

    /* Hoàn thành 6 bước */
    if (step >= STEPS) {

      step = 0;

      pausedUntil =
        now + PAUSE;

      nextStep =
        pausedUntil;

    } else {

      nextStep =
        now + STEP_TIME;

    }

  }

  requestAnimationFrame(animateLogo);
}


/* =========================================================
   BẮT ĐẦU NGAY LẬP TỨC
========================================================= */

requestAnimationFrame(animateLogo);


/* =========================================================
   KHI TAB QUAY LẠI

   Tính lại ngay lập tức thay vì phải chờ
   một chuỗi setTimeout cũ.
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (!document.hidden) {

      const now =
        performance.now();

      if (now >= pausedUntil) {
        nextStep = now;
      }

    }

  }
);

</script>

</body>
</html>
