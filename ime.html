<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>iMell</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<!-- Favicon -->
<link id="favicon" rel="icon" type="image/svg+xml">

<style>
/* =========================================================
   THEME
   ========================================================= */

:root {
  --bg: #000000;
  --fg: #ffffff;

  --logo-outer: #ffffff;
  --logo-middle: #000000;
  --logo-inner: #ffffff;
}

/* Light mode */
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff;
    --fg: #000000;

    --logo-outer: #000000;
    --logo-middle: #ffffff;
    --logo-inner: #000000;
  }
}


/* =========================================================
   PAGE
   ========================================================= */

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  transition:
    background-color 0.15s linear;
}


/* =========================================================
   LOGO + TEXT
   ========================================================= */

.logo-text {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 22px;

  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
}


/* =========================================================
   WEB LOGO
   ========================================================= */

.logo {
  width: 100px;
  height: 100px;

  flex-shrink: 0;

  transform-origin: center center;

  will-change: transform;

  display: block;
}


/* =========================================================
   iMell TEXT
   ========================================================= */

.sample {
  font-family: "Fredoka", sans-serif;

  font-size: 100px;
  font-weight: 600;

  color: var(--fg);

  line-height: 1;

  user-select: none;
  -webkit-user-select: none;

  /*
    Ẩn trong lúc Google Fonts đang tải
    để không bị font cũ → Fredoka sau đó.
  */
  visibility: hidden;

  transition: color 0.15s linear;
}

.sample.font-ready {
  visibility: visible;
}
</style>
</head>


<body>

<div class="logo-text">

  <!-- =====================================================
       iMell LOGO
       ===================================================== -->

  <svg
    class="logo"
    viewBox="0 0 113.34675 113.34675"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >

    <g transform="translate(-182.67759,-124.34157)">

      <!-- Outer -->
      <path
        d="M182.67759,149.34157
        c0,-13.80712 11.19288,-25 25,-25
        l63.34675,0
        c13.80712,0 25,11.19288 25,25
        l0,63.34675
        c0,13.80712 -11.19288,25 -25,25
        h-63.34675
        c-13.80712,0 -25,-11.19288 -25,-25z"
        fill="var(--logo-outer)"
      />

      <!-- Middle -->
      <path
        d="M202.52775,195.53801
        c-7.66241,-7.66241 -7.66241,-20.08564 0,-27.74805
        l23.96413,-23.96413
        c7.66241,-7.66241 20.08564,-7.66241 27.74805,0
        l23.96413,23.96413
        c7.66241,7.66241 7.66241,20.08564 0,27.74805
        l-23.96413,23.96413
        c-7.66241,7.66241 -20.08564,7.66241 -27.74805,0z"
        fill="var(--logo-middle)"
      />

      <!-- Inner -->
      <path
        d="M221.22588,169.06423
        c0,-3.6121 2.92818,-6.54028 6.54028,-6.54028
        h25.19951
        c3.6121,0 6.54028,2.92818 6.54028,6.54028
        l0,25.19951
        c0,3.6121 -2.92818,6.54028 -6.54028,6.54028
        h-25.19951
        c-3.6121,0 -6.54028,-2.92818 -6.54028,-6.54028z"
        fill="var(--logo-inner)"
      />

    </g>

  </svg>


  <!-- =====================================================
       WORDMARK
       ===================================================== -->

  <div class="sample">iMell</div>

</div>


<script>

/* =========================================================
   GOOGLE FONT LOADING
   ========================================================= */

if (document.fonts) {

  document.fonts.ready.then(() => {

    document
      .querySelector(".sample")
      .classList
      .add("font-ready");

  });

} else {

  document
    .querySelector(".sample")
    .classList
    .add("font-ready");

}


/* =========================================================
   FAVICON
   ========================================================= */

const favicon =
  document.getElementById("favicon");


function updateFavicon() {

  const darkMode =
    window.matchMedia &&
    window
      .matchMedia("(prefers-color-scheme: dark)")
      .matches;


  /*
    DARK
      nền favicon  = đen
      giữa          = trắng
      trong         = đen

    LIGHT
      nền favicon  = trắng
      giữa          = đen
      trong         = trắng
  */

  const outerColor =
    darkMode ? "#ffffff" : "#000000";

  const middleColor =
    darkMode ? "#000000" : "#ffffff";

  const innerColor =
    darkMode ? "#ffffff" : "#000000";


  /*
    Dùng placeholder màu riêng.
    Không replace white → black → white,
    tránh lỗi đảo màu dây chuyền.
  */

  const svg = `
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 113.34675 113.34675"
    >

      <path
        d="M182.67759,149.34157
        c0,-13.80712 11.19288,-25 25,-25
        l63.34675,0
        c13.80712,0 25,11.19288 25,25
        l0,63.34675
        c0,13.80712 -11.19288,25 -25,25
        h-63.34675
        c-13.80712,0 -25,-11.19288 -25,-25z"
        transform="translate(-182.67759,-124.34157)"
        fill="${outerColor}"
      />

      <path
        d="M202.52775,195.53801
        c-7.66241,-7.66241 -7.66241,-20.08564 0,-27.74805
        l23.96413,-23.96413
        c7.66241,-7.66241 20.08564,-7.66241 27.74805,0
        l23.96413,23.96413
        c7.66241,7.66241 7.66241,20.08564 0,27.74805
        l-23.96413,23.96413
        c-7.66241,7.66241 -20.08564,7.66241 -27.74805,0z"
        transform="translate(-182.67759,-124.34157)"
        fill="${middleColor}"
      />

      <path
        d="M221.22588,169.06423
        c0,-3.6121 2.92818,-6.54028 6.54028,-6.54028
        h25.19951
        c3.6121,0 6.54028,2.92818 6.54028,6.54028
        l0,25.19951
        c0,3.6121 -2.92818,6.54028 -6.54028,6.54028
        h-25.19951
        c-3.6121,0 -6.54028,-2.92818 -6.54028,-6.54028z"
        transform="translate(-182.67759,-124.34157)"
        fill="${innerColor}"
      />

    </svg>
  `;


  favicon.href =
    "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(svg);
}


updateFavicon();


/* =========================================================
   THEME CHANGE LISTENER
   ========================================================= */

const themeQuery =
  window.matchMedia(
    "(prefers-color-scheme: dark)"
  );


if (themeQuery.addEventListener) {

  themeQuery.addEventListener(
    "change",
    updateFavicon
  );

} else if (themeQuery.addListener) {

  themeQuery.addListener(
    updateFavicon
  );

}


/* =========================================================
   LOGO ANIMATION
   =========================================================

   15°
   ↓
   30°
   ↓
   45°
   ↓
   60°
   ↓
   75°
   ↓
   90°

   Mỗi bước: 0.033 giây

   Sau 6 bước:
   nghỉ 1.35790001 giây

   Sau đó lặp lại.
   ========================================================= */

const logo =
  document.querySelector(".logo");


const STEP = 15;

const STEP_TIME = 33;

const STEPS = 6;

const PAUSE = 1357.90001;


/* Tổng thời gian một chu kỳ */

const CYCLE_TIME =
  STEP_TIME * STEPS + PAUSE;


/*
  Mốc thời gian cố định.
  Không reset khi đổi tab.
*/

const startTime =
  performance.now();


function getRotation(now) {

  const elapsed =
    now - startTime;


  const cycle =
    elapsed % CYCLE_TIME;


  let rotation;


  /*
    6 bước xoay
  */

  if (
    cycle <
    STEP_TIME * STEPS
  ) {

    const step =
      Math.floor(
        cycle / STEP_TIME
      ) + 1;


    rotation =
      step * STEP;

  } else {

    /*
      Đang trong khoảng nghỉ
    */

    rotation =
      STEPS * STEP;
  }


  return rotation;
}


/* =========================================================
   ANIMATION LOOP
   ========================================================= */

function animateLogo(now) {

  logo.style.transform =
    `rotate(${getRotation(now)}deg)`;


  requestAnimationFrame(
    animateLogo
  );
}


/*
  Bắt đầu animation ngay lập tức
*/

requestAnimationFrame(
  animateLogo
);


/* =========================================================
   KHI QUAY LẠI TAB
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (!document.hidden) {

      const now =
        performance.now();


      logo.style.transform =
        `rotate(${getRotation(now)}deg`;
    }

  }
);

</script>

</body>
</html>
