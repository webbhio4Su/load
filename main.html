<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Load</title>
<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}
body{
background:#000;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}
.container{
display:flex;
flex-direction:column;
align-items:center;
gap:50px;
}
/* =========================
LOGO
========================= */
.logo-box{
width:250px;
height:auto;
overflow:visible !important;
filter:drop-shadow(0 0 8px rgba(255,255,255,.35));
}
.logo-box svg,
.logo-box g,
.logo-box path{
overflow:visible !important;
}
/* =========================
LOADER CHÍNH
========================= */
.spinner{
width:56px;
height:56px;
overflow:visible !important;
transform-origin:center;
animation:spin 2s linear infinite;
}
.path{
fill:none;
stroke-width:4;
stroke-linecap:round;
transform-origin:50px 50px;
}
/* =========================
MÀU SẮC
========================= */
.green{
stroke:#a8e6cf;
filter:drop-shadow(0 0 6px rgba(168,230,207,.8));
}
.blue{
stroke:#a8d8ea;
filter:drop-shadow(0 0 6px rgba(168,216,234,.8));
}
.red{
stroke:#ffaaa6;
filter:drop-shadow(0 0 6px rgba(255,170,166,.8));
}
.yellow{
stroke:#ffd3b6;
filter:drop-shadow(0 0 6px rgba(255,211,182,.8));
}
/* =========================
XOAY KHUNG CHUNG
========================= */
@keyframes spin{
from{ transform:rotate(0deg); }
to{ transform:rotate(360deg); }
}
/* =========================
GIAI ĐOẠN ĐẦU (4 MÀU)
========================= */
.green, .blue, .red, .yellow{
stroke-dasharray:25 75;
}
.green{ stroke-dashoffset:0; }
.blue{ stroke-dashoffset:-25; }
.red{ stroke-dashoffset:-50; }
.yellow{ stroke-dashoffset:-75; }
/* =========================
XANH LÁ
========================= */
.green{
animation:greenTransition 8s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes greenTransition{
0%,15%{ opacity:1; stroke-dasharray:25 75; stroke-dashoffset:0; }
25%{ opacity:.85; stroke-dasharray:20 80; }
32%, 82%{ opacity:0; stroke-dasharray:1 99; }
90%{ opacity:.5; stroke-dasharray:12 88; }
95%{ opacity:.8; stroke-dasharray:20 80; }
100%{ opacity:1; stroke-dasharray:25 75; stroke-dashoffset:0; }
}
/* =========================
XANH DƯƠNG
========================= */
.blue{
animation:blueTransition 8s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes blueTransition{
0%,15%{ opacity:1; stroke-dasharray:25 75; stroke-dashoffset:-25; }
25%{ opacity:1; stroke-dasharray:35 120; stroke-dashoffset:-20; }
32%{ opacity:1; stroke-dasharray:60 140; stroke-dashoffset:0; }
40%,78%{ opacity:0; stroke-dasharray:1 99; }
85%{ opacity:1; stroke-dasharray:50 180; stroke-dashoffset:-80; }
92%{ opacity:1; stroke-dasharray:32 90; stroke-dashoffset:-35; }
100%{ opacity:1; stroke-dasharray:25 75; stroke-dashoffset:-25; }
}
/* =========================
ĐỎ
========================= */
.red{
animation:redTransition 8s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes redTransition{
0%,15%{ opacity:1; stroke-dasharray:25 75; stroke-dashoffset:-50; }
32%{ opacity:1; stroke-dasharray:60 140; stroke-dashoffset:-20; }
40%,78%{ opacity:0; stroke-dasharray:1 99; }
85%{ opacity:1; stroke-dasharray:50 180; stroke-dashoffset:-80; }
92%{ opacity:1; stroke-dasharray:32 90; stroke-dashoffset:-52; }
100%{ opacity:1; stroke-dasharray:25 75; stroke-dashoffset:-50; }
}
/* =========================
VÀNG (XOAY TIẾN MƯỢT MÀ TẠI CHỖ)
========================= */
.yellow{
animation:yellowTransition 8s ease-in-out infinite;
}
@keyframes yellowTransition{
/* Bắt đầu đồng bộ cùng 3 màu */
0%, 35%{
stroke-dasharray:25 75;
stroke-dashoffset:-75;
transform: rotate(0deg);
}
/* Vòng 1: Giãn nét tiến tới */
48%{
stroke-dasharray:75 25;
stroke-dashoffset:-175;
transform: rotate(360deg);
}
/* Vòng 2: Thu nét tiến tiếp */
60%{
stroke-dasharray:1 99;
stroke-dashoffset:-275;
transform: rotate(720deg);
}
/* Vòng 3: Hoàn thành 3 vòng tiến */
75%{
stroke-dasharray:75 25;
stroke-dashoffset:-375;
transform: rotate(1080deg);
}
/* Trả stroke-dashoffset về bội số tương đương để không bị xoay giật ngược */
85%{
stroke-dasharray:40 60;
stroke-dashoffset:-472;
transform: rotate(1080deg);
}
100%{
stroke-dasharray:25 75;
stroke-dashoffset:-475;
transform: rotate(1080deg);
}
}
</style>
</head>
<body>
<div class="container">
<!-- LOGO -->
<div class="logo-box">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 122.63864 105.98065">
<g transform="translate(-178.68068,-127.00967)">
<g stroke="none" stroke-width="0" stroke-miterlimit="10">
<path d="M198.42945,189.27373c-4.92621,0 -8.91969,-3.99348 -8.91969,-8.91969v-23.49759c0,-4.92621 3.99348,-8.91969 8.91969,-8.91969h23.49759c4.92621,0 8.91969,3.99348 8.91969,8.91969v23.49759c0,4.92621 -3.99348,8.91969 -8.91969,8.91969z" fill="#ffe280"/>
<path d="M238.97768,206.50476c-9.47358,0 -17.15344,-7.67986 -17.15344,-17.15344v-45.1882c0,-9.47358 7.67986,-17.15344 17.15344,-17.15344h45.1882c9.47358,0 17.15344,7.67986 17.15344,17.15344v45.1882c0,9.47358 -7.67986,17.15344 -17.15344,17.15344z" fill="#ff8080"/>
<path d="M193.68068,232.99033c-8.28427,0 -15,-6.71573 -15,-15v-39.51527c0,-8.28427 6.71573,-15 15,-15h39.51527c8.28427,0 15,6.71573 15,15v39.51527c0,8.28427 -6.71573,15 -15,15z" fill="#80ff95"/>
</g>
</g>
</svg>
</div>
<!-- LOADER -->
<svg class="spinner" viewBox="25 25 50 50">
<circle class="path green" cx="50" cy="50" r="20" pathLength="100"></circle>
<circle class="path blue" cx="50" cy="50" r="20" pathLength="100"></circle>
<circle class="path red" cx="50" cy="50" r="20" pathLength="100"></circle>
<circle class="path yellow" cx="50" cy="50" r="20" pathLength="100"></circle>
</svg>
</div>
<script>
let dots=0;
setInterval(()=>{
dots=(dots+1)%4;
document.title="Load"+".".repeat(dots);
},500);
</script>
</body>
</html>
